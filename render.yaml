services:
  - type: web
    name: skylark-bi-agent
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONDAY_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
    healthCheckPath: /api/health
    autoDeploy: true
